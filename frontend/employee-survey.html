<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2BeLive · Pesquisa Anônima</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap');

  :root {
    --color-primary:      #304269;
    --color-secondary:    #eb6025;
    --color-dark-blue:    #0a1744;
    --color-bg:           #F7F7F5;
    --color-surface:      #ffffff;
    --color-border:       #D9DEE8;
    --color-text-primary: #0a1744;
    --color-text-muted:   #4A5568;
    --color-error:        #fe6c5f;
    --color-tint-blue:    #EEF2F8;
    --color-success-text: #2E7D32;
    /* Aliases */
    --paper:      var(--color-bg);
    --ink:        var(--color-text-primary);
    --ink-soft:   var(--color-text-muted);
    --muted:      var(--color-text-muted);
    --line:       var(--color-border);
    --brand:      var(--color-secondary);
    --brand-soft: var(--color-tint-blue);
    --disabled:   #C3CBC9;
    --red:        var(--color-error);
    /* Glass depth */
    --glass-fill:  rgba(255,255,255,1.00);
    --glass-blur:  20px;
    --card-shadow:
      0 2px 0 0 rgba(255,255,255,0.90) inset,
      0 1px 2px rgba(10,23,68,0.05),
      0 6px 20px rgba(10,23,68,0.09),
      0 20px 44px rgba(10,23,68,0.06);
    --font: 'Nunito', -apple-system, 'Segoe UI', sans-serif;
    --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; --radius-full: 9999px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse 70% 55% at 50% 35%,
        rgba(10,23,68,0.07), rgba(247,247,245,0)),
      var(--color-bg);
    color: var(--color-text-primary);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 16px 48px;
    min-height: 100vh;
  }
  @media (min-width: 600px) { body { justify-content: center; padding: 40px 24px; } }

  .wrap { width: 100%; max-width: 560px; }

  .top-row { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 20px; }
  .demo-toggle {
    font-family: var(--font); font-size: 10.5px; color: var(--muted);
    background: transparent; border: 1px dashed #C3CBC9; border-radius: 20px;
    padding: 5px 10px; cursor: pointer;
  }
  .lang-toggle { display: flex; gap: 4px; background: rgba(217,222,232,0.45); border-radius: 20px; padding: 3px; }
  .lang-toggle button {
    font-family: var(--font); font-size: 13px; font-weight: 600;
    padding: 8px 16px; border-radius: 16px; cursor: pointer; border: none; background: transparent;
    color: var(--ink-soft); min-width: 44px;
  }
  .lang-toggle button.active { background: var(--color-dark-blue); color: #fff; }

  .card { background: #ffffff; border: none; border-radius: var(--radius-lg); border-top: 3px solid var(--color-secondary); box-shadow: 0 2px 12px rgba(10,23,68,0.10), 0 1px 3px rgba(10,23,68,0.06); padding: 26px 20px; }
  @media (min-width: 600px) { .card { padding: 36px 32px; } }

  .eyebrow {
    font-family: var(--font); font-size: 12px; font-weight: 700; color: var(--color-secondary);
    letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 10px;
  }
  h1 { font-family: var(--font); font-weight: 700; font-size: 23px; margin: 0 0 14px; line-height: 1.25; color: var(--color-dark-blue); letter-spacing: -0.2px; }
  @media (min-width: 600px) { h1 { font-size: 27px; } }
  h1.compact { font-size: 24px; margin-bottom: 12px; }
  p.body { font-size: 15px; color: var(--color-dark-blue); opacity: 0.80; line-height: 1.75; margin: 0 0 22px; }

  .anonymity-box { background: #fff; border-radius: 10px; padding: 18px 18px; margin-bottom: 22px; border: 1.5px solid var(--color-border); }
  .anonymity-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; color: var(--color-dark-blue); }
  .anonymity-box ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
  .anonymity-box li { font-size: 14px; color: var(--color-dark-blue); opacity: 0.80; line-height: 1.7; }

  .est-time { font-size: 14px; font-weight: 600; color: var(--color-primary); margin-bottom: 20px; font-family: var(--font); }

  .btn-primary-full {
    width: 100%; font-family: var(--font); font-size: 16px; font-weight: 700;
    background: var(--color-secondary); color: #fff; border: none; border-radius: var(--radius-md); box-shadow: 0 4px 12px rgba(235,96,37,0.30);
    padding: 17px 16px; cursor: pointer; min-height: 52px;
  }
  .btn-primary {
    width: 100%; font-family: var(--font); font-size: 16px; font-weight: 700;
    background: var(--color-secondary); color: #fff; border: none; border-radius: var(--radius-md); box-shadow: 0 4px 12px rgba(235,96,37,0.30);
    padding: 17px 16px; cursor: pointer; min-height: 52px;
  }
  .resume-btn-row { display: flex; gap: 10px; margin-top: 24px; flex-direction: column; }
  @media (min-width: 480px) { .resume-btn-row { flex-direction: row; } }
  .btn-resume {
    flex: 1; font-family: var(--font); font-size: 16px; font-weight: 700;
    background: var(--color-secondary); color: #fff; border: none; border-radius: var(--radius-md); box-shadow: 0 4px 12px rgba(235,96,37,0.28);
    padding: 16px 16px; cursor: pointer; min-height: 52px;
  }
  .btn-restart {
    font-family: var(--font); font-size: 15px; font-weight: 600;
    background: rgba(255,255,255,0.70); color: var(--color-text-muted); border: 1.5px solid var(--line); border-radius: var(--radius-md);
    padding: 15px 16px; cursor: pointer; min-height: 52px;
  }

  .progress-track { height: 4px; background: #E3E8E6; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--color-secondary); transition: width 0.3s ease; }
  .progress-label { font-family: var(--font); font-size: 13px; font-weight: 700; color: var(--color-primary); margin-bottom: 10px; }

  .q-card { padding: 24px 20px; }
  @media (min-width: 600px) { .q-card { padding: 32px 28px; } }
  .q-text { font-family: var(--font); font-weight: 700; font-size: 19px; line-height: 1.45; margin: 0 0 24px; color: var(--color-dark-blue); }
  @media (min-width: 600px) { .q-text { font-size: 21px; } }

  .scale-option {
    width: 100%; text-align: left; padding: 17px 18px; border-radius: 12px;
    border: 1.5px solid #C5CEDB; background: #fff;
    display: flex; align-items: center; gap: 14px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    font-family: var(--font); font-size: 16px; font-weight: 600; color: var(--color-dark-blue);
    margin-bottom: 10px;
  }
  .scale-option:last-child { margin-bottom: 0; }
  .scale-option.selected { border: 1.5px solid var(--brand); background: var(--brand-soft); }
  .scale-radio {
    width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid #B9C2BF; background: #fff; box-sizing: border-box;
  }
  .scale-option.selected .scale-radio { border: 5.5px solid var(--brand); }

  .save-note { font-size: 13px; font-weight: 500; color: var(--color-primary); opacity: 0.65; margin-top: 20px; text-align: center; line-height: 1.6; }

  .nav-row { display: flex; justify-content: space-between; margin-top: 20px; }
  .btn-back {
    font-family: var(--font); font-size: 15px; font-weight: 600;
    background: transparent; color: var(--color-primary); border: none; cursor: pointer; padding: 12px 8px; min-height: 48px;
  }
  .btn-back:disabled { color: var(--disabled); cursor: default; }
  .btn-next {
    font-family: var(--font); font-size: 16px; font-weight: 700;
    background: var(--color-secondary); color: #fff; border: none; border-radius: var(--radius-md); box-shadow: 0 4px 12px rgba(235,96,37,0.28);
    padding: 13px 28px; cursor: pointer; min-height: 48px;
  }
  .btn-next:disabled { background: var(--disabled); cursor: default; }

  .complete-card { text-align: center; padding: 30px 22px; }
  @media (min-width: 600px) { .complete-card { padding: 40px 32px; } }
  .check-icon {
    width: 48px; height: 48px; border-radius: 50%; background: var(--brand-soft);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
  }
  .reward-box { background: var(--paper); border-radius: 12px; padding: 20px 20px; margin-bottom: 8px; }
  .reward-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .reward-body { font-size: 14px; color: var(--ink-soft); line-height: 1.6; margin-bottom: 16px; }
  .code-row {
    background: #fff; border: 1px dashed #B9C2BF; border-radius: 8px;
    padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .code-text { font-family: var(--font); font-size: 16px; font-weight: 700; letter-spacing: 0.8px; color: var(--color-dark-blue); }
  .btn-copy {
    font-family: var(--font); font-size: 13px; font-weight: 700;
    background: var(--color-secondary); color: #fff; border: none; border-radius: 8px;
    padding: 10px 16px; cursor: pointer; white-space: nowrap; min-height: 42px;
  }
  .btn-copy.copied { background: var(--brand-soft); color: var(--color-secondary); }
  .no-reward { font-size: 14px; color: var(--ink-soft); line-height: 1.65; }
  .btn-close {
    display: block; width: 100%; margin-top: 20px; font-family: var(--font); font-size: 16px; font-weight: 600;
    background: rgba(255,255,255,0.70); color: var(--color-text-muted); border: 1.5px solid var(--line); border-radius: var(--radius-md);
    padding: 15px 16px; cursor: pointer; min-height: 52px;
  }

  .lgpd-footer {
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--color-primary);
    opacity: 0.65;
    margin-top: 20px;
    padding-bottom: 8px;
    line-height: 1.6;
    max-width: 560px;
    width: 100%;
  }

  .hidden { display: none !important; }

  /* GHE Picker */
  #ghePickerScreen { display: none; }
  .ghe-picker-title {
    font-size: 1.4rem; font-weight: 700; color: #0a1744;
    margin-bottom: 0.4rem;
  }
  .ghe-picker-subtitle {
    font-size: 0.95rem; color: rgba(10,23,68,0.65);
    margin-bottom: 1.5rem;
  }
  .ghe-options { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.5rem; }
  .ghe-option {
    display: flex; align-items: center; gap: 0.75rem;
    background: rgba(10,23,68,0.04); border: 2px solid rgba(10,23,68,0.12);
    border-radius: 10px; padding: 0.85rem 1rem; cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .ghe-option:hover { background: rgba(10,23,68,0.08); border-color: rgba(235,96,37,0.4); }
  .ghe-option.selected { border-color: #eb6025; background: rgba(235,96,37,0.08); }
  .ghe-option-radio {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid rgba(10,23,68,0.3); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .ghe-option.selected .ghe-option-radio {
    border-color: #eb6025;
    background: #eb6025;
  }
  .ghe-option.selected .ghe-option-radio::after {
    content: ""; width: 7px; height: 7px;
    border-radius: 50%; background: #fff;
  }
  .ghe-option-label { font-size: 1rem; color: #0a1744; font-weight: 600; }
  .ghe-picker-error { color: #ef5350; font-size: 0.88rem; margin-bottom: 0.75rem; display: none; }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-row">
    <button class="demo-toggle" id="demoToggle"></button>
    <div class="lang-toggle">
      <button data-lang="pt" class="active">PT</button>
      <button data-lang="en">EN</button>
    </div>
  </div>

  <!-- LOADING -->
  <div id="loadingScreen" class="card complete-card">
    <div style="margin: 0 auto 20px; width: 44px; height: 44px;">
      <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
        <circle cx="22" cy="22" r="18" fill="none" stroke="#D9DEE8" stroke-width="4"/>
        <circle cx="22" cy="22" r="18" fill="none" stroke="#eb6025" stroke-width="4"
          stroke-dasharray="30 84" stroke-linecap="round" transform="rotate(-90 22 22)">
          <animateTransform attributeName="transform" type="rotate"
            from="0 22 22" to="360 22 22" dur="1s" repeatCount="indefinite"/>
        </circle>
      </svg>
    </div>
    <h1 class="compact" id="loadingTitle" style="font-size:18px;"></h1>
    <p class="body" id="loadingBody" style="padding: 0 8px; font-size:14px;"></p>
  </div>

  <!-- GHE Picker -->
  <div id="ghePickerScreen" class="card hidden">
    <p class="ghe-picker-title" data-k="ghePickerTitle"></p>
    <p class="ghe-picker-subtitle" data-k="ghePickerSubtitle"></p>
    <div class="ghe-options" id="gheOptions"></div>
    <p class="ghe-picker-error" id="ghePickerError" data-k="ghePickerRequired"></p>
    <button class="btn-primary" id="ghePickerBtn" data-k="ghePickerBtn"></button>
  </div>

  <!-- LANDING: fresh -->
  <div id="landingFresh" class="card">
    <div class="eyebrow" data-k="eyebrow"></div>
    <h1 id="welcomeTitle"></h1>
    <p class="body" data-k="welcomeBody"></p>
    <div class="anonymity-box">
      <div class="anonymity-title" data-k="anonymityTitle"></div>
      <ul id="anonymityList"></ul>
    </div>
    <div class="est-time" id="estTime"></div>
    <button class="btn-primary-full" id="startBtn" data-k="startBtn"></button>
  </div>

  <!-- LANDING: resume -->
  <div id="landingResume" class="card hidden">
    <div class="eyebrow" data-k="eyebrow"></div>
    <h1 class="compact" data-k="resumeTitle"></h1>
    <p class="body" id="resumeBody"></p>
    <div class="progress-track"><div class="progress-fill" id="resumeProgressFill"></div></div>
    <div class="resume-btn-row">
      <button class="btn-resume" id="resumeBtn" data-k="resumeBtn"></button>
      <button class="btn-restart" id="restartBtn" data-k="restartBtn"></button>
    </div>
  </div>

  <!-- SURVEY -->
  <div id="surveyScreen" class="hidden">
    <div class="progress-label" id="progressLabel"></div>
    <div class="progress-track" style="margin-bottom: 22px;"><div class="progress-fill" id="surveyProgressFill"></div></div>

    <div class="card q-card">
      <div class="q-text" id="qText"></div>
      <div id="scaleOptions"></div>
      <div class="save-note" data-k="saveNote"></div>
    </div>

    <div class="nav-row">
      <button class="btn-back" id="qBackBtn">← <span data-k="backBtn"></span></button>
      <button class="btn-next" id="qNextBtn"></button>
    </div>
  </div>

  <!-- COMPLETE -->
  <div id="completeScreen" class="card complete-card hidden">
    <div class="check-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M4 12.5L9.5 18L20 6" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 class="compact" data-k="completeTitle"></h1>
    <p class="body" data-k="completeBody" style="padding: 0 8px;"></p>

    <div id="rewardYes" class="reward-box">
      <div class="reward-title" data-k="rewardTitle"></div>
      <div class="reward-body" data-k="rewardBody"></div>
      <div class="code-row">
        <span class="code-text" id="rewardCode"></span>
        <button class="btn-copy" id="copyCodeBtn"></button>
      </div>
    </div>
    <p id="rewardNo" class="no-reward hidden" data-k="noRewardBody"></p>

    <button class="btn-close" data-k="doneBtn"></button>
  </div>

  <!-- INVALID LINK -->
  <div id="invalidScreen" class="card complete-card hidden">
    <div class="check-icon" style="background: var(--color-error-soft, #FEE);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 8v5M12 16h.01" stroke="#B54A3F" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="9" stroke="#B54A3F" stroke-width="2"/>
      </svg>
    </div>
    <h1 class="compact" id="invalidTitle"></h1>
    <p class="body" id="invalidBody" style="padding: 0 8px;"></p>
  </div>
</div>

<p class="lgpd-footer" id="lgpdFooter"></p>

<script>
const DICT = {
  pt: {
    eyebrow: "Pesquisa Anônima de Bem-Estar",
    welcomeTitleFn: (c) => `${c} quer ouvir você`,
    welcomeBody: "Esta pesquisa ajuda a identificar como está o ambiente de trabalho e onde podemos melhorar. Suas respostas são completamente anônimas — ninguém, nem mesmo a equipe de RH, poderá ver quem respondeu o quê.",
    anonymityTitle: "Como protegemos seu anonimato",

    completeTitle: "Obrigado por participar",
    completeBody: "Suas respostas foram enviadas de forma anônima. Elas serão combinadas com as de outros colegas para gerar um panorama da equipe — nenhuma resposta individual é visível.",
    rewardTitle: "Um agradecimento por participar",

    ghePickerSingle: "Geral",
    demoQuestions: [
      { id: "P1", text_pt: "Sei exatamente o que se espera de mim no meu trabalho.", scale: "agree" },
      { id: "D1", text_pt: "Consigo concluir minhas tarefas dentro do horário normal de trabalho.", scale: "agree" },
      { id: "C1", text_pt: "Tenho liberdade para decidir como organizar o meu trabalho.", scale: "freq" },
      { id: "S1", text_pt: "Quando enfrento dificuldades no trabalho, posso contar com a ajuda dos meus colegas.", scale: "freq" },
      { id: "M1", text_pt: "Quando ocorrem mudanças na empresa, entendo claramente os motivos por trás delas.", scale: "agree" },
      { id: "R2", text_pt: "Já fui alvo de comentários ou comportamentos desrespeitosos no ambiente de trabalho.", scale: "freq" },
      { id: "D2", text_pt: "Tenho prazos que considero impossíveis de cumprir.", scale: "freq" },
      { id: "P3", text_pt: "Recebo instruções conflitantes sobre como fazer meu trabalho.", scale: "freq" },
      { id: "M2", text_pt: "Sou consultado(a) ou informado(a) com antecedência sobre mudanças que afetam meu trabalho.", scale: "agree" },
      { id: "D3", text_pt: "Preciso trabalhar em ritmo muito acelerado para dar conta do volume de trabalho.", scale: "freq" },
      { id: "R1", text_pt: "Existe tensão ou atrito entre colegas na minha equipe.", scale: "freq" },
      { id: "C2", text_pt: "Posso escolher o momento de fazer uma pausa quando preciso.", scale: "freq" },
      { id: "S2", text_pt: "Meu gestor direto está disponível quando preciso conversar sobre um problema de trabalho.", scale: "freq" },
      { id: "P2", text_pt: "Entendo claramente quais são minhas responsabilidades no dia a dia.", scale: "agree" },
      { id: "M5", text_pt: "Sinto que consigo me adaptar bem às mudanças na forma como trabalhamos.", scale: "agree" },

let lang = "pt";
let current = 0;
const answers = {};
let questions = [];
let sessionToken = null;
let answeredQuestionIds = [];
let hasSavedSession = false;
let rewardCode = null;
let submitting = false;
let companyName = null; // populated from session response

// GHE state
let ghes = [];          // [{id, name}] fetched from /survey/:token/ghes
let selectedGheId = null;

// Point this at your deployed backend once hosted (see README.md in the
// backend package). Defaults to localhost for local testing.
const API_BASE_URL = "https://nr1-api.onrender.com/api/v1";

// The invite token identifies WHICH company's survey this is — read from
// ?survey=... in the URL. In production each company gets a real link like
// https://app.2belive.com/survey/{token}; this query-param form just lets
// one static HTML file be tested against any cycle.
const urlParams = new URLSearchParams(window.location.search);
const inviteToken = urlParams.get("survey") || "DEMO_TOKEN_NOT_SET";
const existingSessionToken = urlParams.get("t") || null;

function t() { return DICT[lang]; }
function total() { return questions.length; }

// NOTE: question text comes from the server and is Portuguese-only right
// now (survey_question only has a text_pt column — no text_en yet). The
// language toggle still translates all surrounding UI chrome, but question
// wording itself won't change with EN selected until a text_en column and
// translated content are added server-side.

// ── GHE Picker ────────────────────────────────────────────────────
async function loadAndShowGhePicker() {
  showScreen("ghePicker");
  const optionsEl = document.getElementById("gheOptions");
  optionsEl.innerHTML = `<p style="color:rgba(10,23,68,0.5)">${t().ghePickerLoading || "Loading..."}</p>`;

  try {
    const resp = await fetch(`${API_BASE_URL}/survey/${inviteToken}/ghes`);
    if (!resp.ok) throw new Error("fetch_failed");
    ghes = await resp.json();
  } catch (e) {
    optionsEl.innerHTML = `<p style="color:#ef5350">${t().ghePickerError || "Error loading groups."}</p>`;
    return;
  }

  // If only one GHE (typically "Geral"), auto-select and skip the picker.
  if (ghes.length <= 1) {
    selectedGheId = ghes.length === 1 ? ghes[0].id : null;
    await createAndProceed();
    return;
  }

  optionsEl.innerHTML = ghes.map(g => `
    <div class="ghe-option" data-ghe-id="${g.id}" onclick="selectGhe(${g.id})">
      <div class="ghe-option-radio"></div>
      <span class="ghe-option-label">${g.name}</span>
    </div>
  `).join("");
}

function selectGhe(gheId) {
  selectedGheId = gheId;
  document.querySelectorAll(".ghe-option").forEach(el => {
    el.classList.toggle("selected", Number(el.dataset.gheId) === gheId);
  });
  document.getElementById("ghePickerError").style.display = "none";
}

async function confirmGhePicker() {
  if (!selectedGheId) {
    document.getElementById("ghePickerError").style.display = "";
    return;
  }
  await createAndProceed();
}

async function createAndProceed() {
  try {
    const body = { gheId: selectedGheId };
    // If there's an existing session token in localStorage, try to resume
    const stored = localStorage.getItem(`session_${inviteToken}`);
    if (stored) body.existingToken = stored;

    const resp = await fetch(`${API_BASE_URL}/survey/${inviteToken}/session`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await resp.json();

    if (resp.status === 409 && data.error === "already_submitted") {
      showScreen("complete");
      return;
    }
    if (!resp.ok) throw new Error(data.error || "session_error");

    sessionToken = data.sessionToken;
    localStorage.setItem(`session_${inviteToken}`, sessionToken);
    answeredQuestionIds = data.answeredQuestionIds || [];
    hasSavedSession = answeredQuestionIds.length > 0;
    companyName = data.companyName || "";
    // gheId may already be set from picker; if resumed session has it, keep it
    if (data.gheId) selectedGheId = data.gheId;

    const newUrl = `${window.location.pathname}?survey=${inviteToken}&t=${sessionToken}`;
    window.history.replaceState({}, "", newUrl);

    await loadQuestionsAndShow();
  } catch (e) {
    console.error("session_create_error", e);
    // Fall back to showing questions anyway if session creation fails gracefully
  }
}

async function loadQuestionsAndShow() {
  const questionsRes = await fetch(`${API_BASE_URL}/survey/${inviteToken}/questions`);
  if (!questionsRes.ok) throw new Error("questions_failed");
  questions = await questionsRes.json();
  showScreen("landing");
}

async function initSurvey() {
  const isDemo = inviteToken === "DEMO_TOKEN_NOT_SET";

  if (isDemo) {
    showScreen("invalid");
    return;
  }

  // Show loading immediately — never leave a blank screen
  showScreen("loading");

  // After 8 seconds upgrade to a "server is waking up" message
  const slowTimer = setTimeout(() => {
    const titleEl = document.getElementById("loadingTitle");
    const bodyEl = document.getElementById("loadingBody");
    if (titleEl) titleEl.textContent = t().loadingSlowTitle;
    if (bodyEl) bodyEl.textContent = t().loadingSlowBody;
  }, 8000);

  try {
    // Load GHE picker before creating session
    clearTimeout(slowTimer);
    await loadAndShowGhePicker();
  } catch (err) {
    clearTimeout(slowTimer);
    console.warn("Survey load failed:", err.message);
    showScreen("invalid");
  }
}

function firstUnansweredIndex() {
  const idx = questions.findIndex(q => !answeredQuestionIds.includes(q.id));
  return idx === -1 ? 0 : idx;
}

function renderLanding() {
  document.getElementById("demoToggle").classList.add("hidden"); // real mode: no demo toggle needed
  document.getElementById("landingFresh").classList.toggle("hidden", hasSavedSession);
  document.getElementById("landingResume").classList.toggle("hidden", !hasSavedSession);

  document.getElementById("welcomeTitle").textContent = t().welcomeTitleFn(companyName || t().companyName);
  document.getElementById("anonymityList").innerHTML = t().anonymityPoints.map(p => `<li>${p}</li>`).join("");
  document.getElementById("estTime").textContent = t().estTimeFn(total());

  if (hasSavedSession) {
    document.getElementById("resumeBody").textContent =
      t().resumeBodyFn(answeredQuestionIds.length, total());
    document.getElementById("resumeProgressFill").style.width =
      `${(answeredQuestionIds.length / total()) * 100}%`;
  }
}

function renderQuestion() {
  const q = questions[current];
  const scaleLabels = q.scale === "agree" ? t().scaleAgree : t().scaleFreq;

  document.getElementById("progressLabel").textContent = t().progressLabelFn(current + 1, total());
  document.getElementById("surveyProgressFill").style.width = `${((current + 1) / total()) * 100}%`;
  document.getElementById("qText").textContent = (lang === "en" && q.text_en) ? q.text_en : q.text_pt;

  const opts = document.getElementById("scaleOptions");
  opts.innerHTML = scaleLabels.map((label, i) => {
    const val = i + 1;
    const selected = answers[q.id] === val;
    return `
      <button class="scale-option ${selected ? "selected" : ""}" data-value="${val}">
        <span class="scale-radio"></span>${label}
      </button>`;
  }).join("");

  opts.querySelectorAll(".scale-option").forEach(btn => {
    btn.addEventListener("click", async () => {
      const value = Number(btn.getAttribute("data-value"));
      answers[q.id] = value;
      renderQuestion();
      // Auto-save to backend immediately on selection
      try {
        await fetch(`${API_BASE_URL}/survey/${inviteToken}/answer`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionToken, questionId: q.id, rawAnswer: value }),
        });
        if (!answeredQuestionIds.includes(q.id)) answeredQuestionIds.push(q.id);
      } catch (err) {
        console.error("answer_save_failed", err);
      }
    });
  });

  document.getElementById("qBackBtn").disabled = current === 0;
  const nextBtn = document.getElementById("qNextBtn");
  nextBtn.textContent = (current === total() - 1 ? t().submitBtn : t().nextBtn) + " →";
  nextBtn.disabled = answers[q.id] === undefined && !answeredQuestionIds.includes(q.id);
}

function showScreen(name) {
  ["loadingScreen", "ghePickerScreen", "landingFresh", "landingResume", "surveyScreen", "completeScreen", "invalidScreen"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.add("hidden");
  });
  if (name === "loading") {
    document.getElementById("loadingTitle").textContent = t().loadingTitle;
    document.getElementById("loadingBody").textContent = t().loadingBody;
    document.getElementById("loadingScreen").classList.remove("hidden");
  } else if (name === "ghePicker") {
    // Refresh data-k strings for the GHE picker panel
    document.querySelectorAll("#ghePickerScreen [data-k]").forEach(el => {
      const key = el.getAttribute("data-k");
      const val = t()[key];
      if (typeof val === "string") el.textContent = val;
    });
    document.getElementById("ghePickerScreen").classList.remove("hidden");
  } else if (name === "invalid") {
    document.getElementById("invalidTitle").textContent = t().invalidTitle;
    document.getElementById("invalidBody").textContent = t().invalidBody;
    document.getElementById("invalidScreen").classList.remove("hidden");
  } else if (name === "landing") {
    renderLanding();
    document.getElementById(hasSavedSession ? "landingResume" : "landingFresh").classList.remove("hidden");
  } else if (name === "survey") {
    document.getElementById("surveyScreen").classList.remove("hidden");
    renderQuestion();
  } else if (name === "complete") {
    document.getElementById("completeScreen").classList.remove("hidden");
    renderComplete();
  } else if (name === "thankYou") {
    // Alias for complete screen used in createAndProceed already_submitted path
    rewardCode = null;
    document.getElementById("completeScreen").classList.remove("hidden");
    renderComplete();
  }
}

function renderComplete() {
  const hasReward = !!rewardCode;
  document.getElementById("rewardYes").classList.toggle("hidden", !hasReward);
  document.getElementById("rewardNo").classList.toggle("hidden", hasReward);
  if (hasReward) document.getElementById("rewardCode").textContent = rewardCode;
  // Refresh all text on the complete screen so lang toggle works correctly
  document.getElementById("copyCodeBtn").textContent = t().copyBtn;
  document.querySelectorAll("#completeScreen [data-k]").forEach(el => {
    const key = el.getAttribute("data-k");
    const val = t()[key];
    if (typeof val === "string") el.textContent = val;
  });
}

document.querySelector(".btn-close").addEventListener("click", () => {
  // On mobile, window.close() only works if the tab was script-opened.
  // Best UX: try to close, then show a plain "you can close this tab" message
  // so the employee isn't left wondering what happened.
  const btn = document.querySelector(".btn-close");
  try { window.close(); } catch (e) {}
  // If we're still here after 100ms, window.close() didn't work — show message
  setTimeout(() => {
    btn.textContent = lang === "pt"
      ? "✓ Pode fechar esta aba"
      : "✓ You can close this tab";
    btn.style.background = "var(--color-tint-blue)";
    btn.style.color = "var(--color-primary)";
    btn.style.borderColor = "var(--color-primary)";
    btn.disabled = true;
  }, 100);
});

document.getElementById("ghePickerBtn")?.addEventListener("click", confirmGhePicker);

document.getElementById("startBtn").addEventListener("click", () => {
  current = 0;
  showScreen("survey");
});

document.getElementById("resumeBtn").addEventListener("click", () => {
  current = firstUnansweredIndex();
  showScreen("survey");
});
document.getElementById("restartBtn").addEventListener("click", () => {
  current = 0;
  showScreen("survey");
});

document.getElementById("qBackBtn").addEventListener("click", () => {
  if (current > 0) { current--; renderQuestion(); }
});
document.getElementById("qNextBtn").addEventListener("click", async () => {
  if (current < total() - 1) {
    current++;
    renderQuestion();
    return;
  }
  if (submitting) return;
  submitting = true;
  const nextBtn = document.getElementById("qNextBtn");
  const originalLabel = nextBtn.textContent;
  nextBtn.textContent = lang === "pt" ? "Enviando..." : "Submitting...";
  nextBtn.disabled = true;

  try {
    const res = await fetch(`${API_BASE_URL}/survey/${inviteToken}/submit`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionToken }),
    });
    const data = await res.json();
    rewardCode = data.rewardCode || null;
    showScreen("complete");
  } catch (err) {
    console.error("submit_failed", err);
    nextBtn.textContent = originalLabel;
    nextBtn.disabled = false;
    submitting = false;
  }
});

document.getElementById("copyCodeBtn").addEventListener("click", () => {
  if (!rewardCode) return;
  navigator.clipboard?.writeText(rewardCode).catch(() => {});
  const btn = document.getElementById("copyCodeBtn");
  btn.textContent = t().copiedBtn;
  btn.classList.add("copied");
  setTimeout(() => { btn.textContent = t().copyBtn; btn.classList.remove("copied"); }, 1800);
});

document.querySelectorAll(".lang-toggle button").forEach(btn => {
  btn.addEventListener("click", () => {
    lang = btn.getAttribute("data-lang");
    document.querySelectorAll(".lang-toggle button").forEach(b => b.classList.toggle("active", b === btn));
    document.querySelectorAll("[data-k]").forEach(el => {
      const key = el.getAttribute("data-k");
      const val = t()[key];
      if (typeof val === "string") el.textContent = val;
    });
    document.getElementById("lgpdFooter").textContent = t().lgpdFooter;
    if (!document.getElementById("invalidScreen").classList.contains("hidden")) {
      document.getElementById("invalidTitle").textContent = t().invalidTitle;
      document.getElementById("invalidBody").textContent = t().invalidBody;
    }
    if (!document.getElementById("landingFresh").classList.contains("hidden") ||
        !document.getElementById("landingResume").classList.contains("hidden")) renderLanding();
    if (!document.getElementById("surveyScreen").classList.contains("hidden")) renderQuestion();
    if (!document.getElementById("completeScreen").classList.contains("hidden")) renderComplete();
  });
});

// initial static text pass, then load the real survey
document.querySelectorAll("[data-k]").forEach(el => {
  const key = el.getAttribute("data-k");
  const val = t()[key];
  if (typeof val === "string") el.textContent = val;
});
document.getElementById("lgpdFooter").textContent = t().lgpdFooter;
initSurvey();
</script>
