<title>2BeLive &middot; NR-1</title>
<meta name="description" content="Diagn&oacute;stico, a&ccedil;&atilde;o e prova de conformidade com a NR-1." />
<style>
  :root {
    --navy: #0a1744;
    --accent: #eb6025;
    --accent-hover: #d1531e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f8;
  }
  a { text-decoration: none; }
  button { font-family: inherit; }

  .card-link {
    display: block;
    background: #ffffff;
    border: 1px solid #e3e5ec;
    border-radius: 16px;
    padding: 36px 32px;
    box-shadow: 0 4px 16px rgba(10,23,68,0.08);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .card-link:hover {
    border-color: var(--accent);
    box-shadow: 0 12px 28px rgba(10,23,68,0.10);
    transform: translateY(-2px);
  }
  .btn-primary { background: var(--accent); transition: background 0.15s ease; }
  .btn-primary:hover { background: var(--accent-hover); }
  .top-link:hover { opacity: 0.75; }
  .lang-btn { transition: opacity 0.15s ease; border: none; cursor: pointer; }
  .lang-btn:hover { opacity: 0.85; }

  @media (max-width: 720px) {
    .cards-grid { grid-template-columns: 1fr !important; }
    h1 { font-size: 32px !important; }
  }
</style>

</div>

<script>
  var COPY = {
    pt: {
      navLogin: 'J\u00e1 tem conta? Entrar',
      navPartner: 'Seja um parceiro',
      footerLearnMore: 'Saiba mais sobre a plataforma',
      headline: 'Diagn\u00f3stico, a\u00e7\u00e3o e prova de conformidade com a NR\u20111',
      subhead: 'Avalie os riscos psicossociais da sua empresa, gere planos de a\u00e7\u00e3o autom\u00e1ticos e re\u00fana as evid\u00eancias que a fiscaliza\u00e7\u00e3o exige.',
      card1Eyebrow: 'Adicionar sua empresa',
      card1Title: 'Cadastrar empresa',
      card1Body: 'Crie sua conta, gere o link an\u00f4nimo da pesquisa e comece a coletar respostas dos colaboradores hoje.',
      card1Cta: 'Come\u00e7ar cadastro',
      card2Eyebrow: 'J\u00e1 \u00e9 cliente',
      card2Title: 'Painel administrativo',
      card2Body: 'Acesse o diagn\u00f3stico dos seus ciclos, acompanhe os planos de a\u00e7\u00e3o e baixe as evid\u00eancias de conformidade.',
      card2Cta: 'Entrar no painel',
      footerLeft: '\u00a9 2026 2BeLive \u00b7 Todos os direitos reservados mundialmente.',
      htmlLang: 'pt-BR'
    },
    en: {
      navLogin: 'Already have an account? Log in',
      navPartner: 'Become a partner',
      footerLearnMore: 'Learn more about the platform',
      headline: 'Diagnostics, action and proof of NR\u20111 compliance',
      subhead: 'Assess your company\u2019s psychosocial risks, generate action plans automatically, and gather the evidence inspectors require.',
      card1Eyebrow: 'Add your Company',
      card1Title: 'Sign up your company',
      card1Body: 'Create your account, generate the anonymous survey link, and start collecting employee responses today.',
      card1Cta: 'Start sign-up',
      card2Eyebrow: 'Already a client',
      card2Title: 'Admin dashboard',
      card2Body: 'View your cycle diagnostics, track action plans, and download compliance evidence.',
      card2Cta: 'Go to dashboard',
      footerLeft: '\u00a9 2026 2BeLive \u00b7 All Rights Reserved Worldwide.',
      htmlLang: 'en'
    }
  };

  function applyLang(lang) {
    var t = COPY[lang];
    document.documentElement.lang = t.htmlLang;
    document.getElementById('navLoginLink').textContent = t.navLogin;
    document.getElementById('navPartnerLink').textContent = t.navPartner;
    document.getElementById('footerLearnMoreLink').textContent = t.footerLearnMore;
    document.getElementById('headline').textContent = t.headline;
    document.getElementById('subhead').textContent = t.subhead;
    document.getElementById('card1Eyebrow').textContent = t.card1Eyebrow;
    document.getElementById('card1Title').textContent = t.card1Title;
    document.getElementById('card1Body').textContent = t.card1Body;
    document.getElementById('card1Cta').textContent = t.card1Cta;
    document.getElementById('card2Eyebrow').textContent = t.card2Eyebrow;
    document.getElementById('card2Title').textContent = t.card2Title;
    document.getElementById('card2Body').textContent = t.card2Body;
    document.getElementById('card2Cta').textContent = t.card2Cta;
    document.getElementById('footerLeft').textContent = t.footerLeft;

    var ptBtn = document.getElementById('langPtBtn');
    var enBtn = document.getElementById('langEnBtn');
    var accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    if (lang === 'pt') {
      ptBtn.style.background = accent;
      ptBtn.style.color = '#ffffff';
      enBtn.style.background = 'transparent';
      enBtn.style.color = 'rgba(255,255,255,0.7)';
    } else {
      enBtn.style.background = accent;
      enBtn.style.color = '#ffffff';
      ptBtn.style.background = 'transparent';
      ptBtn.style.color = 'rgba(255,255,255,0.7)';
    }

    try { localStorage.setItem('nr1_lang', lang); } catch (e) {}
  }

  document.getElementById('langPtBtn').addEventListener('click', function () { applyLang('pt'); });
  document.getElementById('langEnBtn').addEventListener('click', function () { applyLang('en'); });

  var initialLang = 'pt';
  try {
    var saved = localStorage.getItem('nr1_lang');
    if (saved === 'pt' || saved === 'en') initialLang = saved;
  } catch (e) {}
  applyLang(initialLang);
</script>
