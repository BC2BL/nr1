<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2BeLive · Painel do Administrador</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap');

  :root {
    /* 2BeLive brand tokens */
    --color-primary:      #304269;
    --color-secondary:    #eb6025;
    --color-dark-blue:    #0a1744;
    --color-bg:           #F7F7F5;
    --color-surface:      #ffffff;
    --color-border:       #D9DEE8;
    --color-text-primary: #0a1744;
    --color-text-muted:   #6B7280;
    --color-error:        #fe6c5f;
    --color-error-soft:   rgba(254,108,95,0.10);
    --color-success:      #22C55E;
    --color-success-soft: #E8F5E9;
    --color-success-text: #2E7D32;
    --color-warning:      #ffc000;
    --color-warning-soft: #FFF8E1;
    --color-warning-text: #E65100;
    --color-tint-blue:    #EEF2F8;
    --color-tint-orange:  #FFF0E8;
    --gauge-empty:        #B9C2BF;
    /* Aliases matching old token names for backward compat */
    --paper:      var(--color-bg);
    --ink:        var(--color-text-primary);
    --ink-soft:   var(--color-text-muted);
    --muted:      var(--color-text-muted);
    --line:       var(--color-border);
    --line-soft:  #E5EAF3;
    --brand:      var(--color-secondary);
    --brand-soft: var(--color-tint-blue);
    --green:      var(--color-success-text);
    --green-soft: var(--color-success-soft);
    --amber:      var(--color-warning-text);
    --amber-soft: var(--color-warning-soft);
    --red:        var(--color-error);
    --red-soft:   var(--color-error-soft);
    --grey:       var(--color-text-muted);
    --grey-soft:  var(--color-tint-blue);
    /* Glass depth layer */
    --glass-fill:  rgba(255,255,255,0.80);
    --glass-blur:  20px;
    --card-shadow:
      0 2px 0 0 rgba(255,255,255,0.90) inset,
      0 1px 2px rgba(10,23,68,0.05),
      0 6px 20px rgba(10,23,68,0.09),
      0 20px 44px rgba(10,23,68,0.06);
    /* Font */
    --font: 'Nunito', -apple-system, 'Segoe UI', sans-serif;
    --radius-sm:   4px;
    --radius-md:   8px;
    --radius-lg:   12px;
    --radius-full: 9999px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background:
      radial-gradient(ellipse 70% 55% at 50% 35%,
        rgba(10,23,68,0.07), rgba(247,247,245,0)),
      var(--color-bg);
    color: var(--color-text-primary);
    font-family: var(--font);
    padding: 40px 24px;
  }
  @media (max-width: 640px) { body { padding: 24px 16px; } }

  .wrap { max-width: 980px; margin: 0 auto; }

  /* Header */
  .header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 28px; gap: 16px; flex-wrap: wrap;
  }
  @media (max-width: 640px) { .header { flex-direction: column; align-items: stretch; } }
  .eyebrow {
    font-family: var(--font); font-size: 11px; color: var(--color-secondary);
    letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px;
  }
  .company-name { font-family: var(--font); font-weight: 600; font-size: 28px; margin: 0; }
  @media (max-width: 640px) { .company-name { font-size: 24px; } }
  .cycle-label { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }

  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  @media (max-width: 640px) { .header-right { align-items: stretch; } }

  .lang-toggle { display: flex; gap: 4px; background: rgba(217,222,232,0.45); border-radius: 20px; padding: 3px; align-self: flex-end; }
  @media (max-width: 640px) { .lang-toggle { align-self: flex-start; } }
  .lang-toggle button {
    font-family: var(--font); font-size: 11px; font-weight: 500;
    padding: 5px 11px; border-radius: 16px; cursor: pointer; border: none; background: transparent;
    color: var(--ink-soft);
  }
  .lang-toggle button.active { background: var(--color-dark-blue); color: #fff; }

  .rate-card {
    background: var(--glass-fill); backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur)); border: none; border-radius: var(--radius-lg); box-shadow: var(--card-shadow);
    padding: 12px 18px; min-width: 200px;
  }
  @media (max-width: 640px) { .rate-card { min-width: 0; width: 100%; } }
  .rate-label { font-size: 11px; color: var(--ink-soft); margin-bottom: 6px; }
  .rate-value { font-family: var(--font); font-size: 22px; font-weight: 500; }
  .rate-status { font-size: 11.5px; color: var(--green); margin-left: 8px; }
  .rate-bar-track { height: 5px; background: #E9EDEC; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .rate-bar-fill { height: 100%; background: var(--color-secondary); }
  .rate-seats { font-size: 10.5px; color: var(--muted); margin-top: 6px; font-family: var(--font); }

  /* Vital signs strip */
  .section-title { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 12px; font-weight: 500; }
  .domain-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 32px;
  }
  @media (max-width: 640px) { .domain-grid { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); } }

  .domain-card {
    background: var(--glass-fill); backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur)); border: none; border-radius: var(--radius-lg); box-shadow: var(--card-shadow);
    padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0;
  }
  .domain-card-top { display: flex; flex-direction: column; gap: 6px; }
  .domain-label { font-size: 13px; font-weight: 600; line-height: 1.25; }
  .domain-n { font-family: var(--font); font-size: 11px; color: var(--ink-soft); margin-top: 0; }
  .risk-badge {
    display: inline-block; align-self: flex-start;
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap;
  }
  .risk-badge.green { color: var(--green); background: var(--green-soft); }
  .risk-badge.amber { color: #92400e; background: #FEF3C7; }
  .risk-badge.red { color: var(--red); background: var(--red-soft); }

  .gauge-row { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .gauge-wrap { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
  .gauge-value {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--font); font-size: 15px; font-weight: 500;
  }
  .trend { font-family: var(--font); font-size: 11px; }
  .trend.up { color: var(--green); }
  .trend.down { color: var(--red); }
  .trend.flat { color: var(--muted); }

  .suppressed-box {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10px 4px; gap: 4px; text-align: center;
  }
  .suppressed-n { font-family: var(--font); font-size: 18px; color: var(--gauge-empty); }
  .suppressed-msg { font-size: 11.5px; color: var(--muted); line-height: 1.4; }

  /* Survey link card */
  /* Instrument selector */
  .instrument-card {
    background: var(--glass-fill); border: none; border-radius: var(--radius-lg);
    box-shadow: var(--card-shadow); padding: 18px 22px; margin-bottom: 20px;
    border-top: 3px solid var(--color-primary);
  }
  .instrument-title { font-size: 13px; font-weight: 700; color: var(--color-dark-blue); margin-bottom: 4px; }
  .instrument-subtitle { font-size: 11.5px; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
  .instrument-options { display: flex; flex-direction: column; gap: 8px; }
  .instrument-option {
    display: flex; align-items: flex-start; gap: 12px;
    border: 1.5px solid var(--color-border); border-radius: 10px;
    padding: 12px 14px; cursor: pointer; background: #fff;
    transition: border-color .15s, background .15s;
  }
  .instrument-option.selected { border-color: var(--color-primary); background: var(--color-tint-blue); }
  .instrument-option input[type="radio"] { margin-top: 2px; accent-color: var(--color-primary); flex-shrink: 0; }
  .instrument-option-body { flex: 1; }
  .instrument-option-name { font-size: 13px; font-weight: 700; color: var(--color-dark-blue); margin-bottom: 2px; }
  .instrument-option-desc { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .instrument-option-badge {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px;
    background: var(--color-secondary); color: #fff; margin-left: 6px; vertical-align: middle;
  }
  .instrument-save-btn {
    font-family: var(--font); font-size: 13px; font-weight: 700;
    background: var(--color-primary); color: #fff; border: none; border-radius: 8px;
    padding: 10px 20px; cursor: pointer; margin-top: 12px;
  }
  .instrument-saved { font-size: 12px; color: var(--color-success-text); font-weight: 600; margin-left: 10px; display: none; }

  /* Locked instrument badge — shown after instrument is confirmed */
  .instrument-locked-banner {
    display: flex; align-items: center; gap: 12px;
    background: var(--color-tint-blue); border: 1.5px solid #C7D4E9;
    border-radius: var(--radius-lg); padding: 14px 18px; margin-bottom: 20px;
  }
  .instrument-locked-icon { font-size: 20px; flex-shrink: 0; }
  .instrument-locked-body { flex: 1; }
  .instrument-locked-eyebrow {
    font-size: 10.5px; font-weight: 700; color: var(--color-primary);
    text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 2px;
  }
  .instrument-locked-name {
    font-size: 15px; font-weight: 700; color: var(--color-dark-blue); margin-bottom: 2px;
  }
  .instrument-locked-note {
    font-size: 11.5px; color: var(--muted); line-height: 1.4;
  }

  .survey-link-card {
    background: var(--glass-fill); backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur)); border: none; border-radius: var(--radius-lg); box-shadow: var(--card-shadow);
    padding: 16px 18px; margin-bottom: 20px;
  }
  .survey-link-label { font-size: 11.5px; font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  .survey-link-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: rgba(255,255,255,0.88); border: 1.5px solid var(--color-border);
    border-radius: var(--radius-md); padding: 10px 14px;
  }
  .survey-link-url {
    flex: 1; font-family: var(--font); font-size: 13px; color: var(--color-primary);
    word-break: break-all; min-width: 0;
  }
  .btn-copy-link {
    font-family: var(--font); font-size: 12px; font-weight: 700;
    background: var(--color-secondary); color: #fff; border: none; border-radius: var(--radius-md);
    padding: 7px 14px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(235,96,37,0.25);
  }
  .btn-copy-link.copied { background: var(--color-tint-blue); color: var(--color-primary); }

  /* Reward pool */
  .reward-card {
    background: var(--glass-fill); backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur)); border: none; border-radius: var(--radius-lg); box-shadow: var(--card-shadow);
    padding: 16px 18px; margin-bottom: 32px; display: flex; justify-content: space-between;
    align-items: center; flex-wrap: wrap; gap: 12px;
  }
  .reward-title { font-size: 13px; font-weight: 600; }
  .reward-subtitle { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .reward-right { display: flex; gap: 24px; align-items: center; }
  .reward-count { font-family: var(--font); font-size: 16px; text-align: right; }
  .reward-label { font-size: 10.5px; color: var(--muted); text-align: right; }
  .btn-brand {
    font-family: var(--font); font-size: 12.5px; font-weight: 600;
    background: var(--color-secondary); color: #fff; border: none; border-radius: var(--radius-md); box-shadow: 0 4px 12px rgba(235,96,37,0.28);
    padding: 9px 16px; cursor: pointer;
  }

  /* Action plan */
  .action-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    flex-wrap: wrap; gap: 8px;
  }
  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn {
    font-family: var(--font); font-size: 11.5px;
    padding: 5px 10px; border-radius: 20px; cursor: pointer;
    border: 1px solid var(--line); background: rgba(255,255,255,0.70); color: var(--color-text-muted);
    display: flex; align-items: center; gap: 5px;
  }
  .filter-btn .count {
    font-size: 10px; font-weight: 700; background: rgba(0,0,0,0.08);
    border-radius: 10px; padding: 1px 6px; min-width: 16px; text-align: center;
  }
  .filter-btn.active { border-color: var(--color-primary); background: var(--color-tint-blue); color: var(--color-primary); }
  .filter-btn.active .count { background: rgba(48,66,105,0.12); }
  .action-legend {
    font-size: 11.5px; color: var(--color-text-muted); margin-bottom: 10px;
    line-height: 1.6; padding: 0 2px;
  }
  .action-legend strong { color: var(--color-primary); }
  .action-list { background: var(--glass-fill); backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur)); border: none; border-radius: var(--radius-lg); box-shadow: var(--card-shadow); padding: 4px 16px; }
  .empty-state { padding: 24px 4px; text-align: center; color: var(--muted); font-size: 13px; }
  .status-pill {
    font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
  }
  .status-pill.open { color: var(--grey); background: var(--grey-soft); }
  .status-pill.in_progress { color: #92400e; background: #FEF3C7; }
  .status-pill.completed { color: var(--color-success-text); background: var(--color-success-soft); }
  /* ── Feature 1: Expanded action card ──────────────────────────────── */
  .action-card {
    border-bottom: 1px solid var(--line-soft);
    padding: 0;
  }
  .action-card:last-child { border-bottom: none; }

  .action-card-header {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 16px 4px; cursor: pointer;
    transition: background 0.12s;
  }
  .action-card-header:hover { background: rgba(48,66,105,0.03); border-radius: 8px; }

  .action-card-left { display: flex; align-items: flex-start; gap: 10px; flex: 1; min-width: 0; }
  .action-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }

  .action-card-body { flex: 1; min-width: 0; }
  .action-title { font-size: 14px; font-weight: 600; color: var(--color-dark-blue); line-height: 1.35; }
  .action-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }

  /* Feature 2: Priority badge */
  .priority-badge {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px;
    text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; margin-top: 4px; display: inline-block;
  }
  .priority-high { color: #B54A3F; background: #FEE2E2; }
  .priority-medium { color: #92400e; background: #FEF3C7; }
  .priority-low { color: #1e5f3f; background: #D1FAE5; }

  .action-card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .action-chevron {
    font-size: 11px; color: var(--muted); transition: transform 0.2s;
    width: 20px; text-align: center; flex-shrink: 0;
  }
  .action-card.open .action-chevron { transform: rotate(180deg); }

  /* Feature 1 + 3: Expanded panel */
  .action-expand {
    display: none; padding: 0 4px 16px 30px;
  }
  .action-card.open .action-expand { display: block; }

  .expand-section { margin-bottom: 16px; }
  .expand-section:last-child { margin-bottom: 0; }
  .expand-label {
    font-size: 11px; font-weight: 700; color: var(--color-secondary);
    text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px;
  }
  .expand-desc {
    font-size: 13px; color: var(--color-dark-blue); line-height: 1.65;
    opacity: 0.85;
  }

  /* Feature 3: Quick-start checklist */
  .quickstart-list {
    list-style: none; padding: 0; margin: 0;
    display: flex; flex-direction: column; gap: 6px;
  }
  .quickstart-list li {
    display: flex; align-items: flex-start; gap: 8px;
    font-size: 13px; color: var(--color-dark-blue); line-height: 1.55; opacity: 0.85;
  }
  .quickstart-list li::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--color-secondary); flex-shrink: 0; margin-top: 7px;
  }

  /* Feature 4: Evidence note / progress input */
  .evidence-section {
    background: rgba(48,66,105,0.04); border-radius: 10px;
    padding: 12px 14px; margin-top: 4px;
  }
  .evidence-label {
    font-size: 11px; font-weight: 700; color: var(--color-primary);
    text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px;
  }
  .evidence-textarea {
    width: 100%; box-sizing: border-box;
    font-family: var(--font); font-size: 13px; color: var(--color-dark-blue);
    border: 1.5px solid var(--color-border); border-radius: 8px;
    padding: 10px 12px; resize: vertical; min-height: 72px; outline: none;
    background: #fff; line-height: 1.5;
  }
  .evidence-textarea:focus { border-color: var(--color-primary); }
  .evidence-textarea::placeholder { color: var(--muted); }
  .evidence-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .btn-evidence-save {
    font-family: var(--font); font-size: 12px; font-weight: 700;
    background: var(--color-primary); color: #fff; border: none; border-radius: 7px;
    padding: 8px 16px; cursor: pointer;
  }
  .btn-evidence-save:disabled { background: var(--disabled); cursor: default; }
  .evidence-saved { font-size: 12px; color: var(--color-success-text); font-weight: 600; }

  .training-tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 700; color: var(--color-primary);
    background: var(--color-tint-blue); border-radius: 6px; padding: 3px 10px;
    border: 1px solid rgba(48,66,105,0.15);
  }

  /* ── Feature 5: Worker communication panel ─────────────────────────── */
  .worker-comms-card {
    background: var(--glass-fill); backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur)); border: none;
    border-radius: var(--radius-lg); box-shadow: var(--card-shadow);
    padding: 20px 22px; margin-bottom: 32px;
    border-top: 3px solid var(--color-primary);
  }
  .worker-comms-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .worker-comms-title { font-size: 14px; font-weight: 700; color: var(--color-dark-blue); }
  .worker-comms-subtitle { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .btn-copy-comms {
    font-family: var(--font); font-size: 12px; font-weight: 700;
    background: var(--color-primary); color: #fff; border: none; border-radius: 8px;
    padding: 8px 16px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .btn-copy-comms.copied { background: var(--color-tint-blue); color: var(--color-primary); }
  .comms-preview {
    background: #fff; border: 1.5px solid var(--color-border); border-radius: 10px;
    padding: 16px 18px; font-size: 13px; color: var(--color-dark-blue); line-height: 1.7;
  }
  .comms-preview h3 { font-size: 15px; font-weight: 700; margin: 0 0 8px; color: var(--color-dark-blue); }
  .comms-preview p { margin: 0 0 10px; }
  .comms-preview ul { margin: 0 0 10px; padding-left: 18px; }
  .comms-preview li { margin-bottom: 4px; }
  .comms-preview .comms-footer { font-size: 11.5px; color: var(--muted); margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line-soft); }

  /* GHE Management */
  .ghe-card {
    background: var(--glass-fill); backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
    border: none; border-radius: var(--radius-lg); box-shadow: var(--card-shadow);
    padding: 18px 22px; margin-bottom: 20px;
  }
  .ghe-card .card-title { font-size: 13px; font-weight: 700; color: var(--color-dark-blue); margin: 0 0 4px; }
  .ghe-card .card-subtitle { font-size: 11.5px; color: var(--muted); margin: 0 0 10px; line-height: 1.5; }
  .ghe-list { display: flex; flex-direction: column; gap: 0.5rem; margin: 1rem 0; min-height: 0; }
  .ghe-item {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--color-tint-blue); border: 1px solid var(--color-border);
    border-radius: var(--radius-md); padding: 0.6rem 1rem;
  }
  .ghe-item-name { font-size: 0.9rem; color: var(--color-text-primary); font-weight: 500; }
  .ghe-item-remove {
    background: none; border: none; color: var(--color-error); cursor: pointer;
    font-size: 0.8rem; padding: 0.2rem 0.5rem; border-radius: var(--radius-sm);
    transition: background 0.15s; font-family: var(--font);
  }
  .ghe-item-remove:hover { background: var(--color-error-soft); }
  .ghe-empty-msg { color: var(--color-text-muted); font-size: 0.88rem; font-style: italic; padding: 0.25rem 0; }
  .ghe-add-row { display: flex; gap: 0.75rem; margin-top: 0.5rem; }
  .ghe-add-input {
    flex: 1; background: #fff; border: 1.5px solid var(--color-border);

function getTrainingModule(domainCode, currentLang) {
  const modules = TRAINING_MODULES[currentLang] || TRAINING_MODULES.pt;

}

// ── Feature 2: Priority scoring based on score vs band boundary ────────────
function getPriority(domainCode) {
  const scoreRow = domainScores.find(s => s.domain_code === domainCode);
  if (!scoreRow || !scoreRow.mean_score) return "medium";
  const score = Number(scoreRow.mean_score);
  // Green/amber boundary = 3.5, amber/red boundary = 2.5
  // Distance from boundary determines urgency
  if (scoreRow.risk_band === "red")   return score < 2.0 ? "high" : "medium";
  if (scoreRow.risk_band === "amber") return score < 2.8 ? "high" : "medium";
  return "low";
}

// ── Feature 4: Evidence note save ─────────────────────────────────────────
async function saveEvidence(planId, note, btn, savedEl) {
  btn.disabled = true;
  try {
    const res = await apiFetch(`/action-plans/${planId}/complete`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ evidenceNote: note }),
    });
    if (res.ok) {
      savedEl.textContent = lang === "pt" ? "✓ Salvo" : "✓ Saved";
      savedEl.style.display = "inline";
      // Update local status so filter counts update
      const plan = actionPlans.find(p => p.id === planId);
      if (plan) { plan.status = "completed"; plan.evidence_note = note; }
      renderFilters();
      setTimeout(() => { savedEl.style.display = "none"; }, 3000);
    }
  } catch (e) { console.error("evidence_save_error", e); }
  btn.disabled = false;
}

function t() { return DICT[lang]; }

async function apiFetch(path, opts = {}) {
  const res = await fetch(`${API_BASE_URL}${path}`, {
    ...opts,
    headers: {
      ...(opts.body ? { "Content-Type": "application/json" } : {}),
      ...(opts.headers || {}),
      Authorization: `Bearer ${adminToken}`,
    },
  });
  if (res.status === 401) {
    // Token expired or invalid — drop back to the login screen rather than
    // rendering a dashboard with no data.
    showLogin();
    throw new Error("unauthorized");
  }
  return res;
}

// Like apiFetch, but parses the JSON body and throws (with .status set) on
// any non-2xx response, instead of handing back the raw Response. Use this
// wherever the caller treats the result as already-parsed data.
async function apiFetchJson(path, opts = {}) {
  const res = await apiFetch(path, opts);
  const body = await res.json().catch(() => null);
  if (!res.ok) {
    const err = new Error((body && body.error) || `request_failed_${res.status}`);
    err.status = res.status;
    err.body = body;
    throw err;
  }
  return body;
}

async function loadDashboardData() {

function gaugeSvg(score, band) {
  const pct = score ? (score / 5) * 100 : 0;
  const color = band === "green" ? "#3F7D5C" : band === "amber" ? "#C98A2C" : band === "red" ? "#B54A3F" : "#B9C2BF";
  const circumference = 169.6;
  const dash = (pct / 100) * circumference;
  return `
    <div class="gauge-wrap">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="27" fill="none" stroke="#E3E8E6" stroke-width="6"/>
        <circle cx="32" cy="32" r="27" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="${dash} ${circumference}" transform="rotate(-90 32 32)"/>
      </svg>
      <div class="gauge-value">${score ? Number(score).toFixed(1) : "—"}</div>
    </div>`;
}

function trendHtml(current, prior) {
  // Real domain_score_cache doesn't carry a "prior cycle" comparison yet
  // (that needs a second real cycle to exist) — omitted rather than faked.
  if (!current || !prior) return "";
  const diff = current - prior;
  const up = diff > 0.02, down = diff < -0.02;
  const cls = up ? "up" : down ? "down" : "flat";
  const arrow = up ? "↑" : down ? "↓" : "→";
  return `<span class="trend ${cls}">${arrow} ${Math.abs(diff).toFixed(1)} ${t().vsCycle}</span>`;
}

// ── Instrument selector ──────────────────────────────────────────────────────
let selectedInstrument = "hse_it"; // default

function instrumentDisplayName(code) {
  const found = (t().instruments || []).find(i => i.code === code);
  return found ? found.name : (code || "HSE Management Standards");
}

function renderInstrumentSelector() {
  const card   = document.getElementById("instrumentCard");
  const banner = document.getElementById("instrumentLockedBanner");

  // Nothing to render without cycle data
  if (!cycleInfo) {
    if (card)   card.style.display   = "none";
    if (banner) banner.style.display = "none";
    return;
  }

  const code = cycleInfo.instrumentCode || "hse_it";
  selectedInstrument = code;

  // --- Lock whenever a survey cycle exists (invite token issued = instrument baked in at signup)
  //     OR responses have already started.
  //     cycleInfo.instrumentCode may be null for older accounts created before this field existed,
  //     but the cycle existing at all means the instrument was chosen and the link is live.
  const cycleExists = !!(cycleInfo.inviteUrlToken || cycleInfo.id || cycleInfo.cycleId);
  if (cycleExists || cycleInfo.completedCount > 0) {
    if (card) card.style.display = "none";
    if (banner) {
      banner.style.display = "";
      document.getElementById("lockedEyebrow").textContent = t().lockedEyebrow || "Active instrument";
      document.getElementById("lockedName").textContent    = instrumentDisplayName(code);
      document.getElementById("lockedNote").textContent    = t().lockedNote || "";
    }
    return;
  }

  // --- No instrument confirmed yet and no responses — show editable selector ---
  if (banner) banner.style.display = "none";
  if (!card) return;
  card.style.display = "";

  document.getElementById("instrumentTitle").textContent    = t().instrumentTitle;
  document.getElementById("instrumentSubtitle").textContent = t().instrumentSubtitle;
  document.getElementById("instrumentSaveBtn").textContent  = t().instrumentSaveBtn;

  const opts = t().instruments;
  document.getElementById("instrumentOptions").innerHTML = opts.map(o => `
    <label class="instrument-option ${code === o.code ? "selected" : ""}">
      <input type="radio" name="instrument" value="${o.code}" ${code === o.code ? "checked" : ""}
        onchange="selectInstrument('${o.code}')">
      <div class="instrument-option-body">
        <div class="instrument-option-name">${o.name}${o.badge
          ? `<span class="instrument-option-badge">${o.badge}</span>` : ""}</div>
        <div class="instrument-option-desc">${o.desc}</div>
      </div>
    </label>`).join("");
}

function selectInstrument(code) {
  selectedInstrument = code;
  document.querySelectorAll(".instrument-option").forEach(el => {
    el.classList.toggle("selected", el.querySelector("input").value === code);
  });
}

async function saveInstrument() {
  const btn = document.getElementById("instrumentSaveBtn");
  const saved = document.getElementById("instrumentSaved");
  btn.disabled = true;
  try {
    const res = await apiFetch(
      `/companies/${companyId}/cycles/${cycleId}/instrument`,

  btn.disabled = false;
}

async function loadGhes() {
  if (!cycleInfo || !cycleInfo.id) return;
  try {
    const data = await apiFetchJson(`/cycles/${cycleInfo.id}/ghes`);
    gheList = data || [];
    renderGheManagement();
  } catch (e) { console.error("ghe_load_error", e); }
}

function renderGheManagement() {
  const card = document.getElementById("gheManagementCard");
  if (!card) return;
  card.style.display = cycleInfo ? "" : "none";

  const listEl = document.getElementById("gheList");
  const d = t();
  if (gheList.length === 0) {
    listEl.innerHTML = `<p class="ghe-empty-msg">${d.gheEmpty || ""}</p>`;
  } else {
    listEl.innerHTML = gheList.map(g => `
      <div class="ghe-item">
        <span class="ghe-item-name">${g.name}</span>
        <button class="ghe-item-remove" onclick="removeGhe('${g.id}')" title="Remove">✕</button>
      </div>
    `).join("");
  }
  // localise input placeholder and button
  const inp = document.getElementById("gheNameInput");
  if (inp) {
    inp.placeholder = d.gheAddPlaceholder || "Group name";
    inp.onkeydown = e => { if (e.key === "Enter") addGhe(); };
  }
  const btn = document.getElementById("gheAddBtn");
  if (btn) btn.textContent = d.gheAddBtn || "Add GHE";
}

async function addGhe() {
  const inp = document.getElementById("gheNameInput");
  const errEl = document.getElementById("gheError");
  errEl.style.display = "none";
  const name = inp.value.trim();
  if (!name) return;

  try {
    const created = await apiFetchJson(`/cycles/${cycleInfo.id}/ghes`, {
      method: "POST",
      body: JSON.stringify({ name }),
    });
    inp.value = "";
    gheList.push(created);
    gheList.sort((a, b) => a.display_order - b.display_order || a.id - b.id);
    renderGheManagement();
  } catch (e) {
    const d = t();
    if (e.status === 409) errEl.textContent = d.gheNameExists || "Name already exists.";
    else errEl.textContent = "Error adding GHE.";
    errEl.style.display = "";
  }
}

async function removeGhe(gheId) {
  const d = t();
  if (!confirm(d.gheDeleteConfirm || "Remove this GHE?")) return;
  const errEl = document.getElementById("gheError");
  errEl.style.display = "none";
  try {
    await apiFetchJson(`/cycles/${cycleInfo.id}/ghes/${gheId}`, { method: "DELETE" });
    gheList = gheList.filter(g => g.id !== gheId);
    renderGheManagement();
  } catch (e) {
    if (e.status === 409) errEl.textContent = d.gheHasResponses || "GHE has responses.";
    else errEl.textContent = "Error removing GHE.";
    errEl.style.display = "";
  }
}

// ── GHE Score Breakdown ───────────────────────────────────────────
// Requires GET /api/v1/cycles/:cycleId/ghe-scores — see backend/routes/admin.js
async function loadGheScores() {
  if (!cycleInfo || !cycleInfo.id) return;
  try {
    const data = await apiFetchJson(`/cycles/${cycleInfo.id}/ghe-scores`);
    gheScores = data || {};
    renderGheBreakdowns();
  } catch (e) { console.error("ghe_scores_error", e); }
}

function renderGheBreakdowns() {
  const d = t();
  // For each domain that has a breakdown container, fill it.
  Object.keys(gheScores).forEach(domainCode => {
    const el = document.getElementById(`gheBreakdown_${domainCode}`);
    if (!el) return;
    const rows = gheScores[domainCode];
    if (!rows || rows.length === 0) {
      el.innerHTML = "";
      return;
    }
    const hasAnyGhe = rows.some(r => r.mean_score !== null || r.respondent_count > 0);
    if (!hasAnyGhe) { el.innerHTML = ""; return; }

    el.innerHTML = `
      <h4 style="font-size:0.75rem;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:0.06em;font-weight:700;margin:1rem 0 0.5rem">${d.gheBreakdownTitle || "Results by GHE"}</h4>
      <table class="ghe-breakdown-table">
        <thead>
          <tr>
            <th>GHE</th>
            <th>Score</th>
            <th>n</th>
            <th>Banda</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r => {
            const band = r.risk_band || "none";
            const score = r.mean_score !== null ? Number(r.mean_score).toFixed(2) : `<span style="opacity:.5">${d.suppressed || "—"}</span>`;
            return `<tr>
              <td>${r.ghe_name}</td>
              <td>${score}</td>
              <td>${r.respondent_count}</td>
              <td><span class="band-dot ${band}"></span>${band !== "none" ? band : "—"}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    `;
  });
}

// GHE button wired via onclick in HTML; keydown wired in renderGheManagement().

function renderHeaderAndReward() {
  if (cycleInfo) {
    // Use real company name from API, not the hardcoded DICT fallback
    const nameEl = document.getElementById("companyNameEl") || document.querySelector(".company-name");
    if (nameEl && cycleInfo.companyName) nameEl.textContent = cycleInfo.companyName;
    document.querySelector(".rate-value").textContent = `${Math.round(cycleInfo.responseRate * 100)}%`;
    document.querySelector(".rate-bar-fill").style.width = `${Math.min(cycleInfo.responseRate * 100, 100)}%`;
    document.getElementById("seatsCompleted").textContent =
      lang === "pt"
        ? `${cycleInfo.completedCount} de ${cycleInfo.targetSeatCount} vagas concluídas`
        : `${cycleInfo.completedCount} of ${cycleInfo.targetSeatCount} seats completed`;
    document.getElementById("cycleLabel").textContent = cycleInfo.title || t().cycleLabel;
  }

  const rewardCountEl = document.querySelector(".reward-count");
  if (rewardPoolStatus && rewardPoolStatus.exists) {
    rewardCountEl.textContent = `${rewardPoolStatus.issued} / ${rewardPoolStatus.total}`;
  } else if (rewardPoolStatus) {
    rewardCountEl.textContent = "—";
  }

  // Survey link card
  document.getElementById("surveyLinkLabel").textContent = t().surveyLinkLabel;
  document.getElementById("copySurveyLinkBtn").textContent = t().copyLinkBtn;
  if (cycleInfo && cycleInfo.inviteUrlToken) {
    const surveyUrl = `https://bc2bl.github.io/nr1/frontend/employee-survey.html?survey=${cycleInfo.inviteUrlToken}`;
    document.getElementById("surveyLinkUrl").textContent = surveyUrl;
    document.getElementById("surveyLinkCard").style.display = "";
  } else {
    document.getElementById("surveyLinkCard").style.display = "none";
  }
}

function renderAll() {
  document.querySelectorAll("[data-k]").forEach(el => {
    const key = el.getAttribute("data-k");
    const val = t()[key];
    if (typeof val === "string") el.textContent = val;
  });
  renderHeaderAndReward();
  renderDomains();
  renderFilters();
  renderActions();
  renderWorkerComms();
  renderInstrumentSelector();
  renderGheManagement();
  renderGheBreakdowns();
  // Refresh survey link label and copy button text on lang switch
  document.getElementById("surveyLinkLabel").textContent = t().surveyLinkLabel;
  document.getElementById("copySurveyLinkBtn").textContent = t().copyLinkBtn;
  // Render action plan legend
  const legendEl = document.getElementById("actionLegend");
  if (legendEl) legendEl.innerHTML = t().actionPlanLegend || "";
}

function showLogin() {
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("dashboardWrap").classList.add("hidden");
}

function showDashboard() {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("dashboardWrap").classList.remove("hidden");
}

function applyLoginText() {
  document.getElementById("loginTitle").textContent = t().loginTitle;
  document.getElementById("loginSubtitle").textContent = t().loginSubtitle;
  document.getElementById("loginEmailLabel").textContent = t().loginEmailLabel;
  document.getElementById("loginPasswordLabel").textContent = t().loginPasswordLabel;
  document.getElementById("loginBtn").textContent = t().loginBtn;
}

document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errorEl = document.getElementById("loginError");
  errorEl.classList.add("hidden");

  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  btn.textContent = t().loginBtnLoading;

  try {
    const res = await fetch(`${API_BASE_URL}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = t().loginErrorInvalid;
      errorEl.classList.remove("hidden");
      return;
    }
    adminToken = data.token;
    companyId = data.companyId;
    showDashboard();
    await loadDashboardData();
  } catch (err) {
    errorEl.textContent = t().loginErrorNetwork;
    errorEl.classList.remove("hidden");
  } finally {
    btn.disabled = false;
    btn.textContent = t().loginBtn;
  }
});

document.querySelectorAll(".lang-toggle button").forEach(btn => {
  btn.addEventListener("click", () => {
    lang = btn.getAttribute("data-lang");
    document.querySelectorAll(".lang-toggle button").forEach(b => b.classList.toggle("active", b === btn));
    applyLoginText();
    if (adminToken) renderAll();
  });
});

applyLoginText();

// ── Auto-login from signup redirect ─────────────────────────────────────────
// When the admin arrives from the signup wizard via "Go to Dashboard", the URL
// carries ?token=...&companyId=... so they don't have to log in again.
(function autoLoginFromUrl() {
  try {
    const params = new URLSearchParams(window.location.search);
    const tok = params.get("token");
    const cid = params.get("companyId");
    if (tok && cid) {
      adminToken = tok;
      companyId  = cid;
      // Clean the URL so the token isn't visible in the address bar
      const cleanUrl = window.location.pathname;
      history.replaceState(null, "", cleanUrl);
      showDashboard();
      loadDashboardData();
      return;
    }
  } catch (e) { /* ignore — fall through to manual login */ }
  showLogin();
})();

document.getElementById("copySurveyLinkBtn").addEventListener("click", () => {
  const url = document.getElementById("surveyLinkUrl").textContent;
  const btn = document.getElementById("copySurveyLinkBtn");
  navigator.clipboard?.writeText(url).catch(() => {});
  btn.textContent = t().copiedLinkBtn;
  btn.classList.add("copied");
  setTimeout(() => {
    btn.textContent = t().copyLinkBtn;
    btn.classList.remove("copied");
  }, 2000);
});
